{% extends "users/base.html" %}

{% block title %}Admin Dashboard{% endblock %}

{% block styles %}
<style>
  body {
    font-family: Arial, sans-serif;
    background: #eef3ff;
    margin: 0;
    padding: 0;
    text-align: center;
  }

  .navbar {
    background: #1e3a8a;
    color: white;
    padding: 15px;
    font-size: 22px;
    font-weight: bold;
    box-shadow: 0 2px 5px rgba(0,0,0,0.15);
  }

  .container {
    width: 450px;
    background: white;
    padding: 35px;
    margin: 80px auto;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.15);
    text-align: center;
  }

  h2 {
    color: #1e3a8a;
    margin-bottom: 10px;
  }

  #adminInfo {
    font-size: 17px;
    margin-bottom: 20px;
    color: #333;
  }

  button {
    background: #1e3a8a;
    color: white;
    border: none;
    padding: 12px 20px;
    font-size: 16px;
    border-radius: 6px;
    cursor: pointer;
    width: 60%;
    margin-top: 20px;
  }

  button:hover {
    background: #152c6e;
  }
</style>
{% endblock %}

{% block content %}
<div class="navbar">UAAS Admin Dashboard</div>

<div class="container">
  <h2>Welcome, Admin!</h2>

  <p id="adminInfo">Loading admin info...</p>

  <button onclick="logout()">Logout</button>
</div>
{% endblock %}

{% block scripts %}
<script>
  function logout() {
    localStorage.removeItem("access");
    localStorage.removeItem("role");
    window.location.href = "{% url 'frontend-login' %}";
  }

  document.addEventListener("DOMContentLoaded", () => {
    const role = localStorage.getItem("role");
    const infoBox = document.getElementById("adminInfo");

    if (role !== "ADMIN") {
      infoBox.innerText = "Access denied.";
      return;
    }

    infoBox.innerHTML = `
        <strong>Role:</strong> ${role}<br>
        <strong>Status:</strong> Logged In ✓
    `;
  });
</script>
{% endblock %}
