{% extends "users/base.html" %}

{% block title %}Verify OTP{% endblock %}

{% block styles %}
<style>
  body {
    font-family: Arial, sans-serif;
    background: #eef5ff;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
  }
  .container {
    background: white;
    padding: 35px;
    width: 380px;
    border-radius: 12px;
    box-shadow: 0px 4px 15px rgba(0, 0, 50, 0.15);
  }
  h2 {
    text-align: center;
    color: #1b4db1;
    margin-bottom: 10px;
    font-size: 26px;
  }
  p { text-align: center; color: #333; margin-bottom: 20px; }
  label { font-weight: bold; color: #1b4db1; }
  input {
    width: 100%;
    padding: 12px;
    margin-top: 6px;
    margin-bottom: 18px;
    border-radius: 6px;
    border: 1px solid #b6c8ff;
    background: #f4f7ff;
  }
  button {
    width: 48%;
    padding: 12px;
    border: none;
    border-radius: 6px;
    font-size: 15px;
    cursor: pointer;
  }
  #verifyBtn { background-color: #1b4db1; color: white; }
  #verifyBtn:hover { background-color: #163f8d; }
  #resendBtn {
    background-color: #dbe5ff;
    color: #1b4db1;
    border: 1px solid #a4baff;
  }
  #success { color: green; text-align: center; }
  #error { color: red; text-align: center; }
  .btn-row { display: flex; justify-content: space-between; }
</style>
{% endblock %}

{% block content %}
<div class="container">

  <h2>Email Verification</h2>
  <p>An OTP has been sent to your email.</p>

  <label>Email</label>
  <input id="email" type="text" readonly>

  <label>OTP Code</label>
  <input id="otp" type="text" placeholder="Enter OTP">

  <div class="btn-row">
    <button id="verifyBtn" onclick="verifyOTP()">Verify</button>
    <button id="resendBtn" onclick="resendOTP()">Resend OTP</button>
  </div>

  <p id="error"></p>
  <p id="success"></p>

</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById("email").value =
  localStorage.getItem("verify_email") || "";

async function verifyOTP() {
  const email = localStorage.getItem("verify_email");
  const otp = document.getElementById("otp").value.trim();

  const res = await fetch("http://127.0.0.1:8000/auth/verify-otp/", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ email, otp })
  });

  const data = await res.json();

  if (data.message === "Account verified successfully") {
    document.getElementById("success").innerText = "✓ Account verified! Redirecting...";
    setTimeout(() => {
      window.location.href = "{% url 'frontend-login' %}";
    }, 1500);
  } else {
    document.getElementById("error").innerText =
      data.error || "Invalid OTP.";
  }
}

async function resendOTP() {
  const email = localStorage.getItem("verify_email");

  const res = await fetch("http://127.0.0.1:8000/auth/resend-otp/", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ email })
  });

  const data = await res.json();

  if (data.message === "OTP resent to email") {
    document.getElementById("success").innerText = "✓ New OTP sent!";
  } else {
    document.getElementById("error").innerText =
      data.error || "Unable to resend OTP.";
  }
}
</script>
{% endblock %}
