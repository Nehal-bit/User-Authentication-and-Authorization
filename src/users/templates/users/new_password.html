{% extends "users/base.html" %}

{% block title %}Set New Password{% endblock %}

{% block styles %}
<style>
  body {
    font-family: Arial, sans-serif;
    background: #eef3ff;
    padding: 40px;
  }
  .container {
    width: 380px;
    background: #ffffff;
    padding: 30px;
    margin: auto;
    margin-top: 60px;
    border-radius: 10px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    text-align: center;
    border: 1px solid #c7d5ff;
  }
  h2 { color: #1d4ed8; margin-bottom: 20px; }
  input {
    width: 94%;
    padding: 12px;
    margin: 10px 0;
    border-radius: 6px;
    border: 1px solid #b8c7ff;
    background: #e8efff;
  }
  button {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    font-size: 15px;
    border-radius: 6px;
    cursor: pointer;
    border: none;
  }
  #resetBtn { background-color: #1d4ed8; color: white; }
  #resetBtn:hover { background-color: #153ea7; }
  #backBtn { background: #93a5f8; color: white; }
  #backBtn:hover { background: #7b8fe8; }
  #error { color: red; margin-top: 12px; }

  #popup {
    display: none;
    position: fixed; top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.55);
  }
  #popup-content {
    background: white;
    width: 300px;
    padding: 25px;
    border-radius: 10px;
    margin: 160px auto;
    text-align: center;
    box-shadow: 0 0 15px rgba(0,0,0,0.3);
  }
</style>
{% endblock %}

{% block content %}
<div class="container">
  <h2>Set New Password</h2>

  <input id="password" type="password" placeholder="Enter new password">

  <button id="resetBtn" onclick="resetPassword()">Update Password</button>
  <button id="backBtn" onclick="goBack()">Back to Login</button>

  <p id="error"></p>
</div>

<div id="popup">
  <div id="popup-content">
    <h3>✓ Password Updated</h3>
    <p>You can now log in with your new password.</p>
    <button onclick="goLogin()">Go to Login</button>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function goBack() {
  window.location.href = "{% url 'frontend-login' %}";
}

async function resetPassword() {
  const email = localStorage.getItem("reset_email");
  const token = localStorage.getItem("reset_token");
  const new_password = document.getElementById("password").value;

  const res = await fetch("http://127.0.0.1:8000/auth/reset-password/", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ email, new_password })
  });

  const data = await res.json();

  if (res.ok) {
    document.getElementById("popup").style.display = "block";
    localStorage.removeItem("reset_email");
    localStorage.removeItem("reset_token");
  } else {
    document.getElementById("error").innerText =
      data.error || "Password reset failed.";
  }
}

function goLogin() {
  window.location.href = "{% url 'frontend-login' %}";
}
</script>
{% endblock %}
