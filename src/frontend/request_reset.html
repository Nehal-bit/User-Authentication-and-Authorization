<!DOCTYPE html>
<html>
<head>
  <title>Forgot Password</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 40px;
      max-width: 400px;
      margin: auto;
      background-color: #f3f6ff;
    }
    h2 {
      color: #1d4ed8;
      text-align: center;
    }
    p {
      color: #444;
    }
    input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: 1px solid #b8c7ff;
      border-radius: 6px;
      background: #e8efff;
    }
    button {
      width: 100%;
      padding: 12px;
      background-color: #1d4ed8;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover {
      background-color: #1641b5;
    }
    #msg {
      color: green;
      margin-top: 15px;
      text-align: center;
    }
    #error {
      color: red;
      margin-top: 15px;
      text-align: center;
    }
    .link {
      display: block;
      text-align: center;
      margin-top: 20px;
    }
    a {
      text-decoration: none;
      color: #1d4ed8;
    }
  </style>
</head>
<body>

<h2>Forgot Password</h2>

<p>Enter your email to receive an OTP for password reset.</p>

<label>Email</label>
<input id="email" type="text" placeholder="Enter your email">

<button onclick="sendOTP()">Send OTP</button>

<p id="msg"></p>
<p id="error"></p>

<p class="link"><a href="login.html">Back to Login</a></p>

<script>
async function sendOTP() {
  const email = document.getElementById("email").value.trim();

  const res = await fetch("http://127.0.0.1:8000/auth/request-password-reset/", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ email })
  });

  const data = await res.json();

  if (res.ok) {
    localStorage.setItem("reset_email", email);
    document.getElementById("msg").innerText = "OTP sent to your email.";

    setTimeout(() => {
      window.location.href = "verify_reset.html";
    }, 1500);
  } else {
    document.getElementById("error").innerText =
      data.error || "Something went wrong.";
  }
}
</script>

</body>
</html>
